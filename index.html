<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício boas práticas de CSS</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <div class="produtos">

        <div class="produtos__item produto produto--destaque">
            <img class="produto__imagem" src="https://placehold.co/100x100">
            <h4 class="produto__nome">Nome do produto</h4>
            <p class="produto__descricao">Descrição do produto</p>
        </div>

        <div class="produtos__item produto">
            <img class="produto__imagem" src="https://placehold.co/100x100">
            <h4 class="produto__nome">Nome do produto</h4>
            <p class="produto__descricao">Descrição do produto</p>
        </div>

        <div class="produtos__item produto">
            <img class="produto__imagem" src="https://placehold.co/100x100">
            <h4 class="produto__nome">Nome do produto</h4>
            <p class="produto__descricao">Descrição do produto</p>
        </div>

    </div>

    <script>
        const produtos = document.querySelectorAll('.produto');

        produtos.forEach(produto => {
            produto.addEventListener('click', () => {

                produtos.forEach(p => p.classList.remove('produto--destaque'));

                produto.classList.add('produto--destaque');
            });
        });
    </script>

</body>
</html>
